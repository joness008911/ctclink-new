    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
    
    <!-- Basic source code protection -->
    <script>
      // Disable right-click context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });

      // Disable common developer tools keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        // Disable F12 (Developer Tools)
        if (e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        
        // Disable Ctrl+Shift+I (Developer Tools)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
          e.preventDefault();
          return false;
        }
        
        // Disable Ctrl+Shift+C (Inspect Element)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
          e.preventDefault();
          return false;
        }
        
        // Disable Ctrl+U (View Source)
        if (e.ctrlKey && e.keyCode === 85) {
          e.preventDefault();
          return false;
        }
        
        // Disable Ctrl+S (Save Page)
        if (e.ctrlKey && e.keyCode === 83) {
          e.preventDefault();
          return false;
        }
        
        // Disable Ctrl+Shift+J (Console)
        if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
          e.preventDefault();
          return false;
        }
      });

      // Basic console protection
      try {
        if (typeof console !== 'undefined') {
          console.clear = function() {};
          console.log = function() {};
          console.warn = function() {};
          console.error = function() {};
        }
      } catch(e) {}

      // DevTools detection disabled in development environment
      // Uncomment below for production deployment
      /*
      let devtools = {open: false, orientation: null};
      const threshold = 160;
      
      setInterval(function() {
        if (window.outerHeight - window.innerHeight > threshold || 
            window.outerWidth - window.innerWidth > threshold) {

          }
        } else {
          devtools.open = false;
        }
      }, 500);
      */

      // Disable text selection for additional protection (but allow form interactions)
      document.onselectstart = function(e) {
        // Allow selection in input fields, textareas, and contenteditable elements
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || 
            e.target.contentEditable === 'true') {
          return true;
        }
        return false;
      };
      
      document.onmousedown = function(e) {
        // Allow clicks on interactive elements (inputs, buttons, links, etc.)
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || 
            e.target.tagName === 'TEXTAREA' || e.target.tagName === 'A' ||
            e.target.tagName === 'SELECT' || e.target.type === 'button' ||
            e.target.type === 'submit' || e.target.onclick ||
            e.target.closest('button') || e.target.closest('input')) {
          return true;
        }
        return false;
      };
      
      // Style to disable text selection (but allow in form elements)
      document.body.style.userSelect = 'none';
      document.body.style.webkitUserSelect = 'none';
      document.body.style.mozUserSelect = 'none';
      document.body.style.msUserSelect = 'none';
      
      // Allow selection in form elements
      const style = document.createElement('style');
      style.textContent = `
        input, textarea, [contenteditable="true"] {
          user-select: text !important;
          -webkit-user-select: text !important;
          -moz-user-select: text !important;
          -ms-user-select: text !important;
        }
      `;
      document.head.appendChild(style);
    </script>
